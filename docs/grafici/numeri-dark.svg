<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Claude Code (Opus 5.5): tre programmi Python con agenti IA, con Tokyn e senza">
<rect x="0.5" y="0.5" width="879" height="213" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="28" y="40" font-size="18" font-weight="600" fill="#f0efec">Claude Code (Opus 5.5): tre programmi Python con agenti IA, con Tokyn e senza</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">Sessioni reali, stesse richieste, nessuna chiave API. Con Tokyn Claude scrive in Tokyn e genera il Python.</text>
<rect x="28.0" y="84" width="194.0" height="108" rx="10" fill="none" stroke="rgba(255,255,255,0.10)"/>
<text x="44.0" y="110" font-size="12" fill="#c3c2b7">Costo della sessione</text>
<text x="44.0" y="152" font-size="34" font-weight="600" fill="#f0efec">−69%</text>
<text x="44.0" y="176" font-size="12" fill="#898781">$0,61 invece di $1,99</text>
<rect x="238.0" y="84" width="194.0" height="108" rx="10" fill="none" stroke="rgba(255,255,255,0.10)"/>
<text x="254.0" y="110" font-size="12" fill="#c3c2b7">Token di output</text>
<text x="254.0" y="152" font-size="34" font-weight="600" fill="#f0efec">−54%</text>
<text x="254.0" y="176" font-size="12" fill="#898781">6.931 invece di 14.979</text>
<rect x="448.0" y="84" width="194.0" height="108" rx="10" fill="none" stroke="rgba(255,255,255,0.10)"/>
<text x="464.0" y="110" font-size="12" fill="#c3c2b7">Tempo</text>
<text x="464.0" y="152" font-size="34" font-weight="600" fill="#f0efec">−24%</text>
<text x="464.0" y="176" font-size="12" fill="#898781">144 s invece di 189 s</text>
<rect x="658.0" y="84" width="194.0" height="108" rx="10" fill="none" stroke="rgba(255,255,255,0.10)"/>
<text x="674.0" y="110" font-size="12" fill="#c3c2b7">Provati con l'IA vera</text>
<text x="674.0" y="152" font-size="34" font-weight="600" fill="#f0efec">3 su 3</text>
<text x="674.0" y="176" font-size="12" fill="#898781">senza Tokyn: 0 su 3</text>
