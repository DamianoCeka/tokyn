<svg xmlns="http://www.w3.org/2000/svg" width="880" height="218" viewBox="0 0 880 218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="15 programmi Python che usano Claude, scritti da Claude Code in tre modi">
