[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itsme-lang"
version = "0.1.0"
description = "Itsme: il linguaggio per costruire agenti IA, progettato per essere scritto bene dalle IA."
readme = "README.md"
license = "MIT"
authors = [{ name = "Damiano Ceka" }]
requires-python = ">=3.10"
dependencies = ["lark>=1.1", "anthropic>=0.40"]
keywords = ["ai", "agents", "llm", "language", "claude"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
itsme = "itsme.cli:main"

[project.urls]
Homepage = "https://github.com/DamianoCeka/itsme-lang"

[tool.setuptools]
packages = ["itsme"]

[tool.setuptools.package-data]
itsme = ["grammar.lark", "SPEC.md"]
