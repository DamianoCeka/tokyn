[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokyn"
version = "0.1.0"
description = "Tokyn: il linguaggio per costruire agenti IA, progettato per essere scritto bene dalle IA."
readme = "README.md"
license = "MIT"
authors = [{ name = "Damiano Ceka" }]
requires-python = ">=3.10"
dependencies = ["lark>=1.1", "anthropic>=0.40"]
keywords = ["ai", "agents", "llm", "language", "claude"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tokyn = "tokyn.cli:main"

[project.urls]
Homepage = "https://github.com/DamianoCeka/tokyn"

[tool.setuptools]
packages = ["tokyn"]

[tool.setuptools.package-data]
tokyn = ["grammar.lark", "SPEC.md", "SPEC.en.md"]
